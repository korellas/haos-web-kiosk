# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Web Kiosk
version: "0.2.0"
slug: web_kiosk
description: Shows any URL full-screen on the display attached to this machine
url: "https://github.com/korellas/haos-web-kiosk/tree/main/web-kiosk"
image: "ghcr.io/korellas/haos-web-kiosk"
arch:
  - aarch64
stage: experimental
init: false
# The HA base image uses s6-overlay; allow Chromium time for a clean exit.
timeout: 15

# Display and GPU: DRM/KMS card nodes and render nodes. Paths that do not exist
# on a given machine are ignored by the Supervisor.
# Touch/keyboard/mouse: evdev nodes. Access is granted per node, so a range is
# listed; the touchscreen may use any of these numbers.
devices:
  - /dev/dri/card0
  - /dev/dri/card1
  - /dev/dri/card2
  - /dev/dri/card3
  - /dev/dri/renderD128
  - /dev/dri/renderD129
  - /dev/input/event0
  - /dev/input/event1
  - /dev/input/event2
  - /dev/input/event3
  - /dev/input/event4
  - /dev/input/event5
  - /dev/input/event6
  - /dev/input/event7
  - /dev/input/event8
  - /dev/input/event9
  - /dev/input/event10
  - /dev/input/event11
  - /dev/input/event12
  - /dev/input/event13
  - /dev/input/event14
  - /dev/input/event15
  - /dev/input/event16
  - /dev/input/event17
  - /dev/input/event18
  - /dev/input/event19
  - /dev/input/event20
  - /dev/input/event21
  - /dev/input/event22
  - /dev/input/event23
  - /dev/input/event24
  - /dev/input/event25
  - /dev/input/event26
  - /dev/input/event27
  - /dev/input/event28
  - /dev/input/event29
  - /dev/input/event30
  - /dev/input/event31
# Read-only host udev database; libinput only uses devices udev has initialized.
udev: true

# Map this port in the Network settings only when deploying a private site.
ports:
  2222/tcp: null
ports_description:
  2222/tcp: SFTP deployment (public-key authentication)

backup_exclude:
  - "chromium/*/Cache"
  - "chromium/*/Code Cache"
  - "chromium/*/GPUCache"

options:
  url: "http://homeassistant.local:8123"
  rotation: normal
  chromium_flags: []
  debug: false
  deploy_authorized_keys: []
schema:
  url: url
  rotation: list(normal|90|180|270)
  chromium_flags:
    - "match(^--[A-Za-z0-9][A-Za-z0-9-]*(=.*)?$)"
  debug: bool
  deploy_authorized_keys:
    - str
