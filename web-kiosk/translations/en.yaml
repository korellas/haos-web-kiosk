configuration:
  url:
    name: URL
    description: >-
      Page to show full-screen, for example http://homeassistant.local:8123.
  rotation:
    name: Rotation
    description: >-
      Output rotation applied by the compositor. Touch input follows the
      rotation. Touch Display 2 is portrait by default; use 90 or 270 for
      landscape.
  chromium_flags:
    name: Extra Chromium flags
    description: >-
      Additional Chromium command-line flags, one per entry, for example
      --lang=en-GB.
  debug:
    name: Debug logging
    description: Verbose compositor and browser logs for troubleshooting.
  deploy_authorized_keys:
    name: Deployment public keys
    description: >-
      Ed25519 public keys allowed to upload the private dashboard by SFTP.
      Keep private keys on the deploying computer. Also map the SFTP port in
      Network settings to allow connections.
network:
  2222/tcp: SFTP deployment (disabled by default)
