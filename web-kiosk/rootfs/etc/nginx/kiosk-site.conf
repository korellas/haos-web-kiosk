user nobody;
worker_processes 1;
pid /run/nginx-kiosk.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    access_log off;

    server {
        listen 127.0.0.1:8099;
        server_name _;
        root /data/deploy/site;
        index index.html;
        disable_symlinks on;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
