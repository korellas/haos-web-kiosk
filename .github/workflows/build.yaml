name: Build

# Pull requests build the image without publishing. Pushes to main publish
# ghcr image tags "<version>" and "latest", where <version> comes from
# web-kiosk/config.yaml. An already published version is never overwritten:
# bump the version to release.

on:
  pull_request:
    branches:
      - main
    paths:
      - "web-kiosk/**"
      - ".github/workflows/build.yaml"
  push:
    branches:
      - main
    paths:
      - "web-kiosk/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

env:
  APP_DIR: web-kiosk

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.info.outputs.version }}
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
      url: ${{ steps.info.outputs.url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ env.APP_DIR }}"

      - name: Split image reference
        id: normalize
        env:
          IMAGE: ${{ steps.info.outputs.image }}
        run: |
          echo "image_name=${IMAGE##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${IMAGE%/*}" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Cosign signing
      packages: write # Push to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ env.APP_DIR }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: ${{ github.event_name != 'pull_request' }}
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Cosign signing
      packages: write # Push to GitHub Container Registry
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.prepare.outputs.version }}
